plugins {
	id 'net.fabricmc.fabric-loom' version '1.15.5'
	id 'maven-publish'
}

def targetProperties = new Properties()
file("gradle.properties").withInputStream { targetProperties.load(it) }
targetProperties.each { key, value -> project.ext.set(key, value) }

def minemojiDebug = (project.findProperty("minemojiDebug") ?: "false").toString().toBoolean()
def baseVersion = project.mod_version.toString()

version = minemojiDebug
	? (baseVersion.contains("+") ? baseVersion.replaceFirst(/\+/, "-debug+") : baseVersion + "-debug")
	: baseVersion
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		url = 'https://maven.terraformersmc.com/releases/'
	}
	maven {
		url = 'https://maven.nucleoid.xyz/'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"minemoji" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	main {
		java.srcDir(rootProject.file("common/src/main/java"))
		resources.srcDir(rootProject.file("common/src/main/resources"))
	}
	client {
		if (minemojiDebug) {
			java.srcDir("src/client-debug/java")
			resources.srcDir("src/client-debug/resources")
		} else {
			java.srcDir("src/client-release/java")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	compileOnly "com.google.code.gson:gson:${rootProject.gson_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	clientImplementation "com.github.usefulness:webp-imageio:0.10.2"
	include "com.github.usefulness:webp-imageio:0.10.2"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
